<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domínio do Dinheiro</title>
    <meta http-equiv="refresh" content="0; url=senha.html">
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a237e;
            color: #fff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        a {
            color: #fff;
            font-size: 18px;
            text-decoration: underline;
        }
        a:hover {
            color: #ffd54f;
        }
    </style>

    <!-- CONFIGURAÇÕES DO PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a237e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Domínio Dinheiro">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- REGISTRO DO SERVICE WORKER -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker ativo:', reg))
            .catch(err => console.error('Erro no Service Worker:', err));
        });
      }
    </script>
</head>
<body>
    <div>
        <p style="font-size:24px;margin-bottom:12px;">🔒</p>
        <p style="font-size:18px;margin-bottom:8px;">Acessando página de login...</p>
        <p style="font-size:14px;opacity:0.7;">Clique <a href="senha.html">aqui</a> se não for redirecionado.</p>
    </div>
</body>
</html>
