<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito — Domínio do Dinheiro</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1a237e">
    <style>
        /* ============================================
           ESTILOS DA PÁGINA DE LOGIN
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #1a237e 0%, #0d1555 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: #ffffff;
            border-radius: 16px;
            padding: 48px 40px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 8px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .login-box .icone {
            font-size: 56px;
            margin-bottom: 12px;
        }

        .login-box h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1a237e;
            margin-bottom: 6px;
        }

        .login-box .sub {
            font-size: 15px;
            color: #777;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .login-box .sub strong {
            color: #1a237e;
        }

        .login-box input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 16px;
            transition: all 0.3s;
            background: #fafafa;
        }

        .login-box input:focus {
            outline: none;
            border-color: #1a237e;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(26, 35, 126, 0.1);
        }

        .login-box input::placeholder {
            color: #bbb;
        }

        .login-box button {
            width: 100%;
            padding: 14px;
            background: #1a237e;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-box button:hover {
            background: #0d1555;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(26, 35, 126, 0.3);
        }

        .login-box button:active {
            transform: scale(0.97);
        }

        .login-box .erro {
            color: #c62828;
            font-size: 14px;
            font-weight: 600;
            margin-top: 12px;
            display: none;
            padding: 10px;
            background: #ffebee;
            border-radius: 8px;
        }

        .login-box .erro.mostrar {
            display: block;
        }

        .login-box .dica {
            font-size: 12px;
            color: #aaa;
            margin-top: 16px;
            border-top: 1px solid #eee;
            padding-top: 16px;
        }

        .login-box .dica span {
            color: #1a237e;
            font-weight: 600;
        }

        /* ============================================
           RESPONSIVO
           ============================================ */
        @media (max-width: 480px) {
            .login-box {
                padding: 32px 24px 28px;
            }

            .login-box .icone {
                font-size: 44px;
            }

            .login-box h1 {
                font-size: 22px;
            }

            .login-box .sub {
                font-size: 14px;
            }

            .login-box input {
                font-size: 15px;
                padding: 12px 16px;
            }

            .login-box button {
                font-size: 15px;
                padding: 12px;
            }
        }
    </style>

    <!-- CONFIGURAÇÕES DO PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a237e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Domínio Dinheiro">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- REGISTRO DO SERVICE WORKER -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker ativo:', reg))
            .catch(err => console.error('Erro no Service Worker:', err));
        });
      }
    </script>
</head>
<body>

    <div class="login-box">
        <div class="icone">🔒</div>
        <h1>Domínio do Dinheiro</h1>
        <div class="sub">
            Acesso restrito para clientes.<br>
            Digite a <strong>senha de acesso</strong> para continuar.
        </div>

        <input type="password" id="senhaInput" placeholder="Digite a senha..." onkeydown="if(event.key==='Enter') verificarSenha()">

        <button onclick="verificarSenha()">🔓 Entrar</button>

        <div class="erro" id="erroMsg">
            ❌ Senha incorreta. Tente novamente.
        </div>

        <div class="dica">
            💡 <span>Senha fornecida exclusivamente para clientes</span>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURAÇÃO DA SENHA
        // ALTERE A SENHA AQUI!
        // ============================================
        const SENHA_CORRETA = 'meudinheiro';

        // ============================================
        // FUNÇÃO DE VERIFICAÇÃO
        // ============================================
        function verificarSenha() {
            const input = document.getElementById('senhaInput');
            const erro = document.getElementById('erroMsg');

            if (input.value === SENHA_CORRETA) {
                // Senha correta → redireciona para o conteúdo
                window.location.href = 'index-principal.html';
            } else {
                // Senha incorreta → mostra erro
                erro.classList.add('mostrar');
                input.value = '';
                input.focus();

                // Esconder erro após 3 segundos
                setTimeout(function() {
                    erro.classList.remove('mostrar');
                }, 3000);
            }
        }
    </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('PWA registrado!'))
        .catch(err => console.log('Erro no PWA:', err));
    });
  }
</script>
</body>
</html>
